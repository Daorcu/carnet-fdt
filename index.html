<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet FDT - Sistema de Fidelización</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f5f7;
  color: #1a1a1a;
  line-height: 1.6;
}

.app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

header {
  background: linear-gradient(135deg, #3d3d3d 0%, #555555 100%);
  color: white;
  padding: 18px 24px;
  border-radius: 12px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: 20px;
  font-weight: 600;
}

header .title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-actions {
  display: flex;
  gap: 12px;
}

.header-actions .btn {
  background: rgba(255, 255, 255, 0.15);
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.2s;
}

.header-actions .btn:hover {
  background: rgba(255, 255, 255, 0.25);
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid #e5e5e5;
  padding-bottom: 12px;
}

.tab {
  padding: 10px 16px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-weight: 500;
  color: #999;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.tab.active {
  color: #FF6B35;
  border-bottom-color: #FF6B35;
}

.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.search-bar input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  font-size: 14px;
  background: white;
}

.btn {
  padding: 10px 16px;
  border: 1px solid #e5e5e5;
  background: white;
  color: #1a1a1a;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  transition: all 0.2s;
}

.btn:hover {
  background: #f5f5f7;
  border-color: #d5d5d7;
}

.btn.primary {
  background: #FF6B35;
  color: white;
  border: none;
}

.btn.primary:hover {
  background: #e55a25;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: white;
  padding: 16px;
  border-radius: 8px;
  border: 1px solid #e5e5e5;
  text-align: center;
}

.stat-number {
  font-size: 24px;
  font-weight: 600;
  color: #FF6B35;
}

.stat-label {
  font-size: 11px;
  color: #999;
  margin-top: 6px;
  font-weight: 500;
}

.clients-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.client-card {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.3s;
}

.client-card:hover {
  border-color: #FF6B35;
  box-shadow: 0 4px 12px rgba(255, 107, 53, 0.1);
}

.client-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.client-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FF6B35, #14B8A6);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 16px;
  flex-shrink: 0;
}

.client-info {
  flex: 1;
  min-width: 0;
}

.client-name {
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.client-id {
  font-size: 11px;
  color: #999;
}

.rank-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #F59E0B;
  color: white;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 8px;
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: #e5e5e5;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #FF6B35, #84CC16);
  width: 35%;
}

.client-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px;
  background: #f5f5f7;
  border-radius: 6px;
}

.stat-value {
  font-weight: 600;
  color: #FF6B35;
  font-size: 14px;
}

.stat-name {
  font-size: 10px;
  color: #999;
  margin-top: 2px;
}

.client-actions {
  display: flex;
  gap: 6px;
  font-size: 12px;
}

.client-actions button {
  flex: 1;
  padding: 8px;
  border: 1px solid #e5e5e5;
  background: white;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}

.client-actions button:hover {
  background: #f5f5f7;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: white;
  border-radius: 12px;
  padding: 24px;
  max-width: 700px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-row.full {
  grid-template-columns: 1fr;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: #666;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.form-group input {
  width: 100%;
  padding: 10px;
  border: 1px solid #e5e5e5;
  border-radius: 6px;
  font-size: 13px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-actions button {
  flex: 1;
  padding: 10px;
  border: 1px solid #e5e5e5;
  background: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
}

.modal-actions .btn.primary {
  border: none;
  background: #FF6B35;
  color: white;
}

.tab-content {
  display: block;
}

.tab-content.hidden {
  display: none;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.empty-state i {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.5;
}

@media (max-width: 768px) {
  .clients-list {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .form-row {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title">
      <i class="ti ti-trophy"></i>
      <span>CARNET FDT</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="descargarBackup()">
        <i class="ti ti-download"></i>
        <span>Descargar</span>
      </button>
      <button class="btn" onclick="document.getElementById('backupInput').click()">
        <i class="ti ti-upload"></i>
        <span>Cargar</span>
      </button>
      <input type="file" id="backupInput" style="display:none;" accept=".json" onchange="cargarBackup(event)">
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('admin')">
      <i class="ti ti-users"></i> Admin
    </button>
    <button class="tab" onclick="switchTab('publica')">
      <i class="ti ti-eye"></i> Vista Pública
    </button>
  </div>

  <!-- TAB ADMIN -->
  <div id="admin-tab" class="tab-content">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalClientes">0</div>
        <div class="stat-label">Clientes</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="xpPromedio">0</div>
        <div class="stat-label">XP promedio</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="topRango">—</div>
        <div class="stat-label">Rango común</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="activosMes">0</div>
        <div class="stat-label">Activos mes</div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o ID...">
      <button class="btn primary" onclick="mostrarNuevoCliente()">
        <i class="ti ti-plus"></i> Nuevo
      </button>
    </div>

    <div id="clientsList" class="clients-list"></div>
  </div>

  <!-- TAB PUBLICA -->
  <div id="publica-tab" class="tab-content hidden"></div>
</div>

<!-- MODAL CLIENTE -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">
      <i class="ti ti-user-plus"></i> Nuevo cliente
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="clientNombre" placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label>ID</label>
        <input type="text" id="clientId" placeholder="001">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="clientTelefono" placeholder="+52">
      </div>
      <div class="form-group">
        <label>Fecha inscripción</label>
        <input type="date" id="clientFecha">
      </div>
    </div>

    <div class="form-row full">
      <div class="form-group">
        <label>XP actual</label>
        <input type="number" id="clientXP" value="0" min="0">
      </div>
    </div>

    <div class="modal-actions">
      <button onclick="cerrarModal()">Cancelar</button>
      <button class="btn primary" onclick="guardarCliente()">
        <i class="ti ti-check"></i> Guardar
      </button>
    </div>
  </div>
</div>

<script>
const ranks = [
  { min: 0, max: 299, emoji: "🧭", name: "Explorador" },
  { min: 300, max: 799, emoji: "⭐", name: "Fan" },
  { min: 800, max: 1499, emoji: "❤️", name: "Creyente" },
  { min: 1500, max: 2499, emoji: "🤝", name: "Embajador" },
  { min: 2500, max: 3999, emoji: "🏅", name: "Leyenda" },
  { min: 4000, max: 5999, emoji: "🌟", name: "Memorable" },
  { min: 6000, max: 7999, emoji: "⚡", name: "Mitológico" },
  { min: 8000, max: Infinity, emoji: "🔥", name: "Dios" }
];

let clientes = [];
let clienteEditando = null;

function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.getElementById(tab + '-tab').classList.remove('hidden');
  
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  event.target.closest('.tab').classList.add('active');

  if (tab === 'publica') mostrarVistaPublica();
}

function cargarClientes() {
  const datos = localStorage.getItem('clientesFDT');
  if (datos) {
    try {
      clientes = JSON.parse(datos);
    } catch (e) {
      clientes = [];
    }
  } else {
    clientes = [
      { id: "001", nombre: "David Pérez", telefono: "5551234567", fecha: "2024-07-28", xp: 750 },
      { id: "002", nombre: "María López", telefono: "5559876543", fecha: "2024-06-15", xp: 1200 },
      { id: "003", nombre: "Carlos Gómez", telefono: "5551111111", fecha: "2024-08-01", xp: 200 },
    ];
    guardarClientesLS();
  }
  renderizarClientes();
  actualizarEstadísticas();
}

function guardarClientesLS() {
  localStorage.setItem('clientesFDT', JSON.stringify(clientes));
}

function actualizarEstadísticas() {
  document.getElementById('totalClientes').textContent = clientes.length;
  const promedio = clientes.length > 0 ? Math.round(clientes.reduce((a, c) => a + c.xp, 0) / clientes.length) : 0;
  document.getElementById('xpPromedio').textContent = promedio;
  
  const rangos = clientes.map(c => ranks.find(r => c.xp >= r.min && c.xp <= r.max));
  const moda = rangos.length > 0 ? rangos[0].emoji : '—';
  document.getElementById('topRango').textContent = moda;
  
  const ahora = new Date();
  const activos = clientes.filter(c => {
    const fecha = new Date(c.fecha);
    return (ahora - fecha) / (1000 * 60 * 60 * 24) <= 30;
  }).length;
  document.getElementById('activosMes').textContent = activos;
}

function renderizarClientes() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtrados = clientes.filter(c => 
    c.nombre.toLowerCase().includes(search) || c.id.includes(search)
  );

  const html = filtrados.length > 0 ? filtrados.map(cliente => {
    const rango = ranks.find(r => cliente.xp >= r.min && cliente.xp <= r.max);
    return `
      <div class="client-card">
        <div class="client-header">
          <div class="client-avatar">${cliente.nombre.charAt(0).toUpperCase()}</div>
          <div class="client-info">
            <div class="client-name">${cliente.nombre}</div>
            <div class="client-id">ID: ${cliente.id}</div>
          </div>
        </div>
        <div class="rank-badge">${rango.emoji} ${rango.name}</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${Math.min(cliente.xp / 8000 * 100, 100)}%"></div>
        </div>
        <div class="client-stats">
          <div class="stat-small">
            <div class="stat-value">${cliente.xp}</div>
            <div class="stat-name">XP</div>
          </div>
        </div>
        <div class="client-actions">
          <button onclick="editarCliente('${cliente.id}')">✏️ Editar</button>
          <button onclick="eliminarCliente('${cliente.id}')">🗑️ Eliminar</button>
        </div>
      </div>
    `;
  }).join('') : '<div class="empty-state"><i class="ti ti-inbox"></i><p>No hay clientes registrados</p></div>';

  document.getElementById('clientsList').innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', renderizarClientes);

function mostrarNuevoCliente() {
  clienteEditando = null;
  document.getElementById('modalTitle').innerHTML = '<i class="ti ti-user-plus"></i> Nuevo cliente';
  document.getElementById('clientNombre').value = '';
  document.getElementById('clientId').value = '';
  document.getElementById('clientTelefono').value = '';
  document.getElementById('clientFecha').valueAsDate = new Date();
  document.getElementById('clientXP').value = '0';
  document.getElementById('modalOverlay').classList.add('active');
}

function editarCliente(id) {
  clienteEditando = clientes.find(c => c.id === id);
  document.getElementById('modalTitle').innerHTML = `<i class="ti ti-edit"></i> Editar: ${clienteEditando.nombre}`;
  document.getElementById('clientNombre').value = clienteEditando.nombre;
  document.getElementById('clientId').value = clienteEditando.id;
  document.getElementById('clientTelefono').value = clienteEditando.telefono;
  document.getElementById('clientFecha').value = clienteEditando.fecha;
  document.getElementById('clientXP').value = clienteEditando.xp;
  document.getElementById('modalOverlay').classList.add('active');
}

function guardarCliente() {
  const nombre = document.getElementById('clientNombre').value;
  const id = document.getElementById('clientId').value;
  const telefono = document.getElementById('clientTelefono').value;
  const fecha = document.getElementById('clientFecha').value;
  const xp = parseInt(document.getElementById('clientXP').value) || 0;

  if (!nombre || !id) {
    alert('Nombre e ID son requeridos');
    return;
  }

  if (clienteEditando) {
    const idx = clientes.findIndex(c => c.id === clienteEditando.id);
    clientes[idx] = { id, nombre, telefono, fecha, xp };
  } else {
    clientes.push({ id, nombre, telefono, fecha, xp });
  }

  guardarClientesLS();
  renderizarClientes();
  actualizarEstadísticas();
  cerrarModal();
}

function eliminarCliente(id) {
  if (confirm('¿Eliminar cliente?')) {
    clientes = clientes.filter(c => c.id !== id);
    guardarClientesLS();
    renderizarClientes();
    actualizarEstadísticas();
  }
}

function cerrarModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) {
    cerrarModal();
  }
});

function descargarBackup() {
  const datos = JSON.stringify(clientes, null, 2);
  const blob = new Blob([datos], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `carnet-fdt-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function cargarBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      clientes = JSON.parse(e.target.result);
      guardarClientesLS();
      renderizarClientes();
      actualizarEstadísticas();
      alert('✅ Datos restaurados correctamente');
    } catch (error) {
      alert('❌ Error al cargar el archivo');
    }
  };
  reader.readAsText(file);
}

function mostrarVistaPublica() {
  const params = new URLSearchParams(window.location.search);
  const clienteId = params.get('ver');
  
  if (!clienteId) {
    document.getElementById('publica-tab').innerHTML = `
      <div class="empty-state">
        <i class="ti ti-search"></i>
        <p>Accede con ?ver=ID_CLIENTE para ver la vista pública</p>
      </div>
    `;
    return;
  }

  const cliente = clientes.find(c => c.id === clienteId);
  if (!cliente) {
    document.getElementById('publica-tab').innerHTML = `
      <div class="empty-state">
        <i class="ti ti-alert"></i>
        <p>Cliente no encontrado</p>
      </div>
    `;
    return;
  }

  const rango = ranks.find(r => cliente.xp >= r.min && cliente.xp <= r.max);
  const progreso = Math.min(cliente.xp / 8000 * 100, 100);

  document.getElementById('publica-tab').innerHTML = `
    <div style="text-align: center; padding: 40px;">
      <div style="font-size: 48px; margin-bottom: 12px;">${cliente.nombre.charAt(0).toUpperCase()}</div>
      <h1 style="font-size: 24px; margin-bottom: 8px;">${cliente.nombre}</h1>
      <div class="rank-badge" style="margin: 0 auto 30px;">
        ${rango.emoji} ${rango.name}
      </div>

      <div style="margin: 30px 0;">
        <div style="font-size: 12px; color: #999; margin-bottom: 8px;">XP Actual</div>
        <div style="font-size: 32px; font-weight: 600; color: #FF6B35; margin-bottom: 8px;">${cliente.xp}</div>
        <div style="width: 200px; height: 12px; background: #e5e5e5; border-radius: 6px; overflow: hidden; margin: 0 auto 8px;">
          <div style="height: 100%; background: linear-gradient(90deg, #FF6B35, #84CC16); width: ${progreso}%;"></div>
        </div>
        <div style="font-size: 11px; color: #666;">8000 XP total</div>
      </div>

      <p style="color: #999; margin-top: 30px;">¡Sigue completando retos para subir de nivel!</p>
    </div>
  `;
}

window.addEventListener('load', () => {
  cargarClientes();
  
  const params = new URLSearchParams(window.location.search);
  if (params.has('ver')) {
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById('admin-tab').classList.add('hidden');
    document.getElementById('publica-tab').classList.remove('hidden');
    document.querySelector('header').style.display = 'none';
    document.querySelector('.tabs').style.display = 'none';
    mostrarVistaPublica();
  }
});
</script>

</body>
</html>
