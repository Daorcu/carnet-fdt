<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet FDT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Work Sans', sans-serif; background: #f5f7fa; color: #333; }
        .app { min-height: 100vh; display: flex; flex-direction: column; }
        
        /* PANTALLA INICIAL */
        .inicio { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .inicio-box { background: white; padding: 60px 40px; border-radius: 16px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .inicio-logo { font-size: 48px; margin-bottom: 30px; }
        .inicio-title { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
        .inicio-subtitle { font-size: 14px; color: #999; margin-bottom: 40px; }
        .inicio-buttons { display: flex; flex-direction: column; gap: 12px; }
        .btn-option { padding: 16px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; font-family: 'Work Sans', sans-serif; transition: all 0.3s; }
        .btn-cliente { background: #667eea; color: white; }
        .btn-cliente:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3); }
        .btn-admin { background: white; color: #667eea; border: 2px solid #667eea; }
        .btn-admin:hover { background: #f5f7fa; transform: translateY(-2px); }

        /* ADMIN PANEL */
        .admin { display: none; flex: 1; }
        .admin.active { display: flex; flex-direction: column; }
        header { background: white; padding: 20px 30px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; font-weight: 700; }
        .header-actions { display: flex; gap: 12px; }
        .btn { padding: 10px 16px; background: white; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: 'Work Sans', sans-serif; transition: all 0.2s; }
        .btn:hover { border-color: #667eea; color: #667eea; }
        .btn.primary { background: #667eea; color: white; border: none; }
        .btn.primary:hover { background: #5568d3; }
        .btn-logout { background: #f5f5f5; }
        .btn-logout:hover { background: #e0e0e0; }

        .admin-content { flex: 1; padding: 30px; overflow-y: auto; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        .stat-num { font-size: 28px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 12px; color: #999; margin-top: 8px; }
        .search { margin-bottom: 20px; display: flex; gap: 12px; }
        .search input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Work Sans', sans-serif; }
        .clients { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        .card:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1); }
        .card-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .card-id { font-size: 12px; color: #999; margin-bottom: 12px; }
        .card-rank { display: inline-block; background: #fef3e2; color: #d97706; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-bottom: 12px; }
        .card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; background: #f5f7fa; border-radius: 6px; margin-bottom: 12px; }
        .card-stat { text-align: center; }
        .card-stat-num { font-size: 16px; font-weight: 700; color: #667eea; }
        .card-stat-label { font-size: 10px; color: #999; }
        .card-actions { display: flex; gap: 6px; }
        .card-actions .btn { flex: 1; font-size: 12px; padding: 8px 12px; }

        /* VISTA CLIENTE */
        .cliente-view { display: none; flex: 1; }
        .cliente-view.active { display: flex; flex-direction: column; }
        .cliente-header { background: white; padding: 40px 30px; text-align: center; border-bottom: 1px solid #eee; }
        .cliente-avatar { width: 80px; height: 80px; border-radius: 50%; background: #667eea; color: white; font-size: 36px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .cliente-name { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .cliente-id { font-size: 12px; color: #999; margin-bottom: 20px; }
        .cliente-rank { display: inline-block; background: #fef3e2; color: #d97706; padding: 8px 16px; border-radius: 16px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        .cliente-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 400px; margin: 0 auto; }
        .cliente-stat { background: #f5f7fa; padding: 16px; border-radius: 8px; text-align: center; }
        .cliente-stat-num { font-size: 24px; font-weight: 700; color: #667eea; }
        .cliente-stat-label { font-size: 12px; color: #999; margin-top: 4px; }
        .cliente-progress { max-width: 400px; margin: 20px auto; }
        .progress-label { font-size: 12px; color: #999; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 50%; }
        .cliente-content { flex: 1; padding: 30px; overflow-y: auto; max-width: 1200px; margin: 0 auto; width: 100%; }
        .cliente-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .bloques { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .bloque { background: white; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
        .bloque-header { padding: 16px; display: flex; align-items: center; gap: 12px; color: white; font-weight: 600; }
        .bloque-icon { width: 24px; height: 24px; }
        .retos-list { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .reto-item { padding: 12px; background: #f5f7fa; border-radius: 6px; font-size: 12px; display: flex; align-items: flex-start; gap: 8px; }
        .reto-check { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
        .reto-info { flex: 1; }
        .reto-name { font-weight: 500; margin-bottom: 4px; }
        .reto-xp { font-size: 11px; color: #667eea; font-weight: 600; }
        .cliente-back { position: fixed; bottom: 30px; right: 30px; }
        .cliente-back .btn { padding: 12px 24px; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-box { background: white; padding: 30px; border-radius: 12px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Work Sans', sans-serif; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal-actions button { flex: 1; padding: 12px; }
        
        .hidden { display: none; }
        
        @media (max-width: 768px) {
            body { font-size: 14px; }
            header { flex-direction: column; gap: 12px; text-align: center; padding: 16px; }
            header h1 { font-size: 20px; }
            .header-actions { width: 100%; flex-wrap: wrap; }
            .btn { padding: 8px 12px; font-size: 12px; }
            .admin-content { padding: 16px; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .search { flex-direction: column; }
            .search input { font-size: 14px; }
            .clients { grid-template-columns: 1fr; }
            .card { padding: 16px; }
            .modal-box { width: 95%; max-height: 90vh; padding: 20px; max-width: 100%; }
            .modal-title { font-size: 16px; }
            .form-group { margin-bottom: 12px; }
            .form-group input { padding: 8px; font-size: 14px; }
            
            /* Retos modal responsive */
            #modal-retos-temp { padding: 10px 0 !important; }
            #modal-retos-temp .modal-box { max-width: 98%; width: 98%; padding: 16px; }
            #retos-contenedor { padding: 0 !important; }
            #retos-contenedor > div { margin-bottom: 16px !important; }
            #retos-contenedor label { grid-template-columns: 1fr !important; align-items: flex-start !important; padding: 10px 8px !important; }
            #retos-contenedor input[type="checkbox"] { margin-bottom: 0; }
            .retos-grid-mobile { grid-template-columns: 1fr !important; gap: 6px !important; padding: 8px !important; }
            
            /* Cliente view responsive */
            .cliente-header { padding: 20px 16px; }
            .cliente-name { font-size: 24px; }
            .cliente-avatar { width: 60px; height: 60px; font-size: 28px; }
            .cliente-stats { grid-template-columns: 1fr; }
            .cliente-content { padding: 16px; }
            .bloques { grid-template-columns: 1fr; }
            .reto-item { font-size: 11px; padding: 10px 8px; }
            
            .inicio-box { padding: 40px 24px; }
            .inicio-title { font-size: 24px; }
            .inicio-subtitle { font-size: 13px; }
            .btn-option { padding: 14px 20px; font-size: 14px; }
            
            .cliente-back { bottom: 20px; right: 20px; }
            .cliente-back .btn { padding: 10px 16px; font-size: 12px; }
        }
        
        @media (max-width: 480px) {
            .stat-card { padding: 12px; }
            .stat-num { font-size: 20px; }
            .stat-label { font-size: 10px; }
            .card-name { font-size: 16px; }
            .card-stat-num { font-size: 14px; }
            .card-actions { flex-direction: column; }
            .cliente-stat-num { font-size: 18px; }
            .progress-label { font-size: 11px; }
            header h1 { font-size: 18px; }
            .modal-box { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- PANTALLA INICIO -->
    <div id="inicio" class="inicio">
        <div class="inicio-box">
            <div class="inicio-logo">🏆</div>
            <h1 class="inicio-title">Carnet FDT</h1>
            <p class="inicio-subtitle">Sistema de fidelización gamificado</p>
            <div class="inicio-buttons">
                <button class="btn-option btn-cliente" onclick="irCliente()">
                    👤 Soy Cliente
                </button>
                <button class="btn-option btn-admin" onclick="solicitarPassword()">
                    🔑 Soy Admin
                </button>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin" class="admin">
        <header>
            <h1>Panel Admin</h1>
            <div class="header-actions">
                <button class="btn" onclick="descargarJSON()">📥 Descargar</button>
                <button class="btn" onclick="document.getElementById('file-input').click()">📤 Cargar</button>
                <button class="btn btn-logout" onclick="volverInicio()">← Salir</button>
            </div>
            <input id="file-input" type="file" accept=".json" onchange="cargarJSON(event)" style="display:none;">
        </header>

        <div class="admin-content">
            <div class="stats">
                <div class="stat-card"><div class="stat-num" id="stat-clientes">0</div><div class="stat-label">Clientes</div></div>
                <div class="stat-card"><div class="stat-num" id="stat-xp">0</div><div class="stat-label">XP prom</div></div>
                <div class="stat-card"><div class="stat-num" id="stat-rango">—</div><div class="stat-label">Rango común</div></div>
                <div class="stat-card"><div class="stat-num" id="stat-activos">0</div><div class="stat-label">Activos</div></div>
            </div>

            <div class="search">
                <input type="text" id="buscar" placeholder="Buscar cliente..." onkeyup="mostrarAdmin()">
                <button class="btn primary" onclick="nuevoCliente()">+ Nuevo</button>
            </div>

            <div id="admin-clientes" class="clients"></div>
        </div>
    </div>

    <!-- VISTA CLIENTE -->
    <div id="cliente" class="cliente-view">
        <div class="cliente-header">
            <div class="cliente-avatar" id="cliente-avatar">A</div>
            <div class="cliente-name" id="cliente-name">Anamari Romero</div>
            <div class="cliente-id" id="cliente-id">ID: FDT1003</div>
            <div class="cliente-rank" id="cliente-rank">🧭 Explorador</div>
            <div class="cliente-stats">
                <div class="cliente-stat">
                    <div class="cliente-stat-num" id="cliente-xp">0</div>
                    <div class="cliente-stat-label">Puntos</div>
                </div>
                <div class="cliente-stat">
                    <div class="cliente-stat-num" id="cliente-retos">0</div>
                    <div class="cliente-stat-label">Retos</div>
                </div>
            </div>
            <div class="cliente-progress">
                <div class="progress-label">Progreso: <span id="cliente-prog">0</span>%</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cliente-fill" style="width:0%;"></div>
                </div>
            </div>
        </div>

        <div class="cliente-content">
            <div class="cliente-title">Mis Retos</div>
            <div id="cliente-bloques" class="bloques"></div>
        </div>

        <div class="cliente-back">
            <button class="btn" onclick="volverInicio()">← Volver</button>
        </div>
    </div>
</div>

<!-- MODAL CLIENTE -->
<div id="modal-cliente" class="modal">
    <div class="modal-box">
        <div class="modal-title">Nuevo cliente</div>
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="campo-nombre" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label>ID</label>
            <input type="text" id="campo-id" placeholder="001">
        </div>
        <div class="form-group">
            <label>Teléfono</label>
            <input type="text" id="campo-telefono" placeholder="+52">
        </div>
        <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="campo-fecha">
        </div>
        <div class="form-group">
            <label>XP</label>
            <input type="number" id="campo-xp" value="0" min="0">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="cerrarModal()">Cancelar</button>
            <button class="btn primary" onclick="guardarCliente()">Guardar</button>
        </div>
    </div>
</div>

<!-- MODAL PASSWORD -->
<div id="modal-password" class="modal">
    <div class="modal-box">
        <div class="modal-title">Acceso Admin</div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="campo-password" placeholder="Ingresa contraseña" onkeypress="if(event.key==='Enter') verificarPassword()">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="cerrarPassword()">Cancelar</button>
            <button class="btn primary" onclick="verificarPassword()">Entrar</button>
        </div>
    </div>
</div>

<!-- MODAL CLIENTE SELECCIONAR -->
<div id="modal-cliente-id" class="modal">
    <div class="modal-box">
        <div class="modal-title">Ingresa tu ID</div>
        <div class="form-group">
            <label style="font-size: 12px; color: #999; margin-bottom: 12px;">Ej: FDT1014</label>
            <input type="text" id="campo-cliente-id" placeholder="FDT..." onkeypress="if(event.key==='Enter') abrirCliente()" style="text-transform: uppercase;">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="volverInicio()">Cancelar</button>
            <button class="btn primary" onclick="abrirCliente()">Ver carnet</button>
        </div>
    </div>
</div>

<script>
const RANKS = [
    {min:0, max:299, emoji:"🧭", name:"Explorador"},
    {min:300, max:799, emoji:"⭐", name:"Fan"},
    {min:800, max:1499, emoji:"❤️", name:"Creyente"},
    {min:1500, max:2499, emoji:"🤝", name:"Embajador"},
    {min:2500, max:3999, emoji:"🏅", name:"Leyenda"},
    {min:4000, max:5999, emoji:"🌟", name:"Memorable"},
    {min:6000, max:7999, emoji:"⚡", name:"Mitológico"},
    {min:8000, max:Infinity, emoji:"🔥", name:"Dios"}
];

const BLOQUES = [
    {nombre:"Redes Sociales", icon:"📱", color:"#FF6B35", retos:["Síguenos en Instagram","Sube foto etiquetándonos","Sube un Reel","Comparte en stories","Comenta en 3 posts","Grábate con producto"]},
    {nombre:"Compras Mínimas", icon:"💳", color:"#7C3AED", retos:["$100 MXN","$200 MXN","$400 MXN","$600 MXN","$850 MXN","$1,100 MXN+"]},
    {nombre:"Frecuencia", icon:"🔄", color:"#14B8A6", retos:["2 compras/mes","4 compras/2 meses","3 meses consec","6 compras/3 meses","6 meses consec","12 compras/año"]},
    {nombre:"Personalización", icon:"✨", color:"#F59E0B", retos:["Color personal","Grabado láser","Funko personal","Funko mascota","Funko familiar","Funko original"]},
    {nombre:"Creador", icon:"🎨", color:"#84CC16", retos:["Primer producto","Adorno","Llavero","Imán","Separador","Set 3 piezas"]},
    {nombre:"Referidos", icon:"👥", color:"#EC4899", retos:["WhatsApp","1 amigo","2 amigos","3 amigos","5 amigos","8 amigos"]},
    {nombre:"Premium", icon:"👑", color:"#3B82F6", retos:["1 mes","$500","3 meses","$1,500","6 meses","$4,000"]},
    {nombre:"Corte Láser", icon:"✂️", color:"#8B5CF6", retos:["Grabado","Llavero","Organizador","Adorno cocina","Marcador","Set regalo"]},
    {nombre:"Familia Maker", icon:"👨‍👩‍👧‍👦", color:"#06B6D4", retos:["Dibujo","Elección","Color","Historia","Mascota","Proyecto"]}
];

const XP_RETOS = [20,40,80,60,50,150, 30,50,80,120,180,300, 30,60,120,180,280,450, 30,50,120,130,150,250, 30,50,100,120,180,300, 30,80,150,250,400,600, 30,50,100,150,250,400, 80,120,180,250,320,500, 40,60,100,120,180,300];

const PASSWORD_ADMIN = "PZ4tV_XxtAl6JK2g";

let clientes = [];
let clienteEnEdicion = null;
let clienteViendose = null;

// Limpiar datos viejos (versiones anteriores a v5.4)
(function limpiarDatosViejos() {
    const versionVieja = localStorage.getItem('versionCarnet');
    if (versionVieja !== 'v5.4') {
        console.log('🧹 Limpiando datos de versión vieja...');
        localStorage.removeItem('clientesFDT');
        localStorage.setItem('versionCarnet', 'v5.4');
    }
})();

function cargarDatos() {
    try {
        const datos = localStorage.getItem('clientesFDT');
        if (datos) {
            clientes = JSON.parse(datos);
        } else {
            // Intenta cargar desde GitHub (si existe clientes.json)
            cargarDesdeGitHub();
            return;
        }
    } catch(e) {
        clientes = [];
    }
    
    // Detectar si viene con ?ver=ID en la URL
    detectarYCargarCliente();
}

function cargarDesdeGitHub() {
    // URL del archivo JSON en GitHub (rama main)
    const urlGitHub = 'https://raw.githubusercontent.com/daorcu/carnet-fdt/main/clientes.json';
    
    fetch(urlGitHub)
        .then(response => {
            if (response.ok) return response.json();
            throw new Error('No existe clientes.json en GitHub');
        })
        .then(datos => {
            if (Array.isArray(datos)) {
                clientes = datos;
                localStorage.setItem('clientesFDT', JSON.stringify(clientes));
                console.log('✅ Datos cargados desde GitHub:', clientes);
                detectarYCargarCliente();
            }
        })
        .catch(error => {
            console.log('ℹ️ No se encontró clientes.json en GitHub:', error.message);
            clientes = [];
            detectarYCargarCliente();
        });
}

function detectarYCargarCliente() {
    // Detectar si viene con ?ver=ID en la URL
    const url = new URLSearchParams(window.location.search);
    if (url.has('ver')) {
        const idCliente = url.get('ver').toUpperCase().trim();
        
        console.log('🔍 Buscando cliente:', idCliente);
        console.log('📊 Clientes disponibles:', clientes.map(c => c.id));
        
        const cliente = clientes.find(c => c.id.toUpperCase().trim() === idCliente);
        
        if (cliente) {
            console.log('✅ Cliente encontrado:', cliente);
            clienteViendose = cliente;
            sessionStorage.setItem('clienteViendose', cliente.id);
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('cliente').classList.add('active');
            mostrarCliente();
        } else {
            console.log('❌ Cliente NO encontrado');
            console.log('ID buscado:', idCliente);
            console.log('IDs en sistema:', clientes.map(c => c.id.toUpperCase()));
            alert('❌ Cliente no encontrado: ' + idCliente + '\n\nClientes disponibles:\n' + (clientes.length > 0 ? clientes.map(c => c.id).join('\n') : 'Ninguno'));
            window.location.href = window.location.pathname;
        }
    } else {
        // Sin ?ver= parámetro → Es ADMIN
        const adminEnSession = sessionStorage.getItem('adminLogueado');
        
        if (adminEnSession === 'true') {
            // Ya está logueado como admin, mostrar panel
            document.getElementById('cliente').style.display = 'none';
            document.getElementById('admin').classList.add('active');
            mostrarAdmin();
        } else {
            // Mostrar modal de contraseña
            document.getElementById('cliente').style.display = 'none';
            document.getElementById('admin').classList.add('active');
            document.getElementById('modal-password').classList.add('active');
            document.getElementById('campo-password').value = '';
            document.getElementById('campo-password').focus();
        }
    }
}

function guardarDatos() {
    localStorage.setItem('clientesFDT', JSON.stringify(clientes));
    console.log('💾 Datos guardados en localStorage');
    console.log('📤 Para sincronizar en otros dispositivos, descarga el JSON y sube a GitHub como clientes.json');
}

function volverInicio() {
    sessionStorage.removeItem('clienteViendose');
    sessionStorage.removeItem('adminLogueado');
    // Redirigir a la URL base (sin ?ver=)
    window.location.href = window.location.pathname;
}

function solicitarPassword() {
    document.getElementById('modal-password').classList.add('active');
    document.getElementById('campo-password').value = '';
    document.getElementById('campo-password').focus();
}

function verificarPassword() {
    const pass = document.getElementById('campo-password').value;
    if (pass === PASSWORD_ADMIN) {
        sessionStorage.setItem('adminLogueado', 'true');
        document.getElementById('inicio').style.display = 'none';
        document.getElementById('admin').classList.add('active');
        mostrarAdmin();
        cerrarPassword();
    } else {
        alert('❌ Contraseña incorrecta');
    }
}

function cerrarPassword() {
    document.getElementById('modal-password').classList.remove('active');
}

function irCliente() {
    document.getElementById('modal-cliente-id').classList.add('active');
    document.getElementById('campo-cliente-id').value = '';
    document.getElementById('campo-cliente-id').focus();
}

function abrirCliente() {
    const id = document.getElementById('campo-cliente-id').value.trim().toUpperCase();
    const cliente = clientes.find(c => c.id.toUpperCase() === id);
    
    if (!cliente) {
        alert('❌ Cliente no encontrado');
        return;
    }

    clienteViendose = cliente;
    sessionStorage.setItem('clienteViendose', id);
    document.getElementById('inicio').style.display = 'none';
    document.getElementById('cliente').classList.add('active');
    mostrarCliente();
    document.getElementById('modal-cliente-id').classList.remove('active');
}

function mostrarAdmin() {
    const busca = document.getElementById('buscar').value.toLowerCase();
    const filtrados = clientes.filter(c => c.nombre.toLowerCase().includes(busca) || c.id.includes(busca));
    
    document.getElementById('stat-clientes').textContent = clientes.length;
    const prom = clientes.length ? Math.round(clientes.reduce((a, c) => a + c.xp, 0) / clientes.length) : 0;
    document.getElementById('stat-xp').textContent = prom;
    
    const ranks = clientes.map(c => RANKS.find(r => c.xp >= r.min && c.xp <= r.max));
    document.getElementById('stat-rango').textContent = ranks.length ? ranks[0].emoji : '—';
    
    const ahora = new Date();
    const activos = clientes.filter(c => {
        const fecha = new Date(c.fecha);
        return (ahora - fecha) / (1000 * 60 * 60 * 24) <= 30;
    }).length;
    document.getElementById('stat-activos').textContent = activos;

    const html = filtrados.map(c => {
        const r = RANKS.find(r => c.xp >= r.min && c.xp <= r.max);
        const retosCompletos = (c.retos || []).filter(x => x).length;
        return `
            <div class="card">
                <div class="card-name">${c.nombre}</div>
                <div class="card-id">ID: ${c.id}</div>
                <div class="card-rank">${r.emoji} ${r.name}</div>
                <div class="card-stats">
                    <div class="card-stat"><div class="card-stat-num">${c.xp}</div><div class="card-stat-label">XP</div></div>
                    <div class="card-stat"><div class="card-stat-num">${retosCompletos}</div><div class="card-stat-label">Retos</div></div>
                </div>
                <div class="card-actions">
                    <button class="btn" onclick="editarCliente('${c.id}')">✏️ Editar</button>
                    <button class="btn" onclick="eliminarCliente('${c.id}')">🗑️</button>
                </div>
            </div>
        `;
    }).join('');
    
    document.getElementById('admin-clientes').innerHTML = html || '<p style="grid-column:1/-1;text-align:center;color:#999;padding:40px;">Sin clientes</p>';
}

function mostrarCliente() {
    const c = clienteViendose;
    const r = RANKS.find(r => c.xp >= r.min && c.xp <= r.max);
    const prog = Math.min((c.xp / 8000) * 100, 100);
    const retosCompletos = (c.retos || []).filter(x => x).length;

    document.getElementById('cliente-avatar').textContent = c.nombre.charAt(0).toUpperCase();
    document.getElementById('cliente-name').textContent = c.nombre;
    document.getElementById('cliente-id').textContent = 'ID: ' + c.id;
    document.getElementById('cliente-rank').textContent = r.emoji + ' ' + r.name;
    document.getElementById('cliente-xp').textContent = c.xp;
    document.getElementById('cliente-retos').textContent = retosCompletos;
    document.getElementById('cliente-prog').textContent = Math.round(prog);
    document.getElementById('cliente-fill').style.width = prog + '%';

    let html = '';
    BLOQUES.forEach((bloque, idx) => {
        html += `<div class="bloque" style="border-left: 4px solid ${bloque.color};">
            <div class="bloque-header" style="background-color:${bloque.color};">
                <span class="bloque-icon">${bloque.icon}</span>
                ${bloque.nombre}
            </div>
            <div class="retos-list">
        `;
        
        bloque.retos.forEach((reto, rIdx) => {
            const totalIdx = idx * 6 + rIdx;
            const completado = c.retos ? c.retos[totalIdx] : false;
            const xp = XP_RETOS[totalIdx];
            html += `
                <div class="reto-item">
                    <div class="reto-check">${completado ? '✅' : '⭕'}</div>
                    <div class="reto-info">
                        <div class="reto-name">${reto}</div>
                        <div class="reto-xp">${xp} XP</div>
                    </div>
                </div>
            `;
        });
        
        html += `</div></div>`;
    });

    document.getElementById('cliente-bloques').innerHTML = html;
}

function nuevoCliente() {
    clienteEnEdicion = null;
    document.getElementById('campo-nombre').value = '';
    document.getElementById('campo-id').value = '';
    document.getElementById('campo-telefono').value = '';
    document.getElementById('campo-fecha').valueAsDate = new Date();
    document.getElementById('campo-xp').value = '0';
    document.getElementById('modal-cliente').classList.add('active');
}

function editarCliente(id) {
    clienteEnEdicion = clientes.find(c => c.id === id);
    if (!clienteEnEdicion.retos) clienteEnEdicion.retos = Array(54).fill(false);
    
    window.location.href = '#editar-' + id;
    abrirVistaRetos(id);
}

function abrirVistaRetos(id) {
    clienteEnEdicion = clientes.find(c => c.id === id);
    if (!clienteEnEdicion.retos) clienteEnEdicion.retos = Array(54).fill(false);
    
    let html = `<div style="max-width:900px;margin:0 auto;padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <div>
                <h2 style="font-size:20px;font-weight:700;margin:0;">${clienteEnEdicion.nombre}</h2>
                <div style="font-size:12px;color:#999;">ID: ${clienteEnEdicion.id}</div>
            </div>
            <button class="btn" onclick="cerrarVistaRetos()">✕ Cerrar</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;padding:16px;background:#f5f7fa;border-radius:8px;">
            <div>
                <div style="font-size:12px;color:#999;">Rango:</div>
                <div id="retos-rango" style="font-size:18px;font-weight:700;color:#667eea;">🧭 Explorador</div>
            </div>
            <div>
                <div style="font-size:12px;color:#999;">XP Total:</div>
                <div id="retos-xp" style="font-size:18px;font-weight:700;color:#667eea;">0</div>
            </div>
        </div>
        <div id="retos-contenedor" style="border-top:1px solid #eee;padding-top:20px;"></div>
        <button class="btn primary" style="width:100%;margin-top:20px;padding:12px;" onclick="guardarVistaRetos()">Guardar cambios</button>
    </div>`;
    
    let retosHtml = '';
    BLOQUES.forEach((bloque, idx) => {
        retosHtml += `<div style="margin-bottom:20px;background:white;border:1px solid #eee;border-radius:8px;overflow:hidden;">
            <div style="background:${bloque.color};color:white;padding:12px;font-weight:600;">${bloque.icon} ${bloque.nombre}</div>
            <div class="retos-grid-mobile" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:8px;padding:12px;">
        `;
        
        bloque.retos.forEach((reto, rIdx) => {
            const totalIdx = idx * 6 + rIdx;
            const completado = clienteEnEdicion.retos[totalIdx];
            const xp = XP_RETOS[totalIdx];
            
            retosHtml += `
                <label style="display:flex;flex-direction:column;align-items:flex-start;padding:12px;background:${completado?'#f0f0f0':'white'};border:1px solid #ddd;border-radius:6px;cursor:pointer;user-select:none;gap:8px;">
                    <input type="checkbox" data-idx="${totalIdx}" ${completado ? 'checked' : ''} onchange="actualizarRetos()" style="width:18px;height:18px;cursor:pointer;">
                    <div style="flex:1;width:100%;">
                        <div style="font-weight:600;font-size:13px;">${reto}</div>
                        <div style="font-size:11px;color:#999;margin-top:4px;">${xp} XP</div>
                    </div>
                </label>
            `;
        });
        
        retosHtml += `</div></div>`;
    });

    html = html.replace('</div>', retosHtml + '</div>');
    
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.id = 'modal-retos-temp';
    modal.style.cssText = 'align-items:flex-start;overflow-y:auto;padding:20px 0;';
    modal.innerHTML = '<div class="modal-box" style="max-width:900px;width:95%;margin-top:20px;margin-bottom:20px;padding:0;">' + html + '</div>';
    document.body.appendChild(modal);
    modal.onclick = (e) => { if(e.target === modal) cerrarVistaRetos(); };
    
    actualizarRetos();
}

function actualizarRetos() {
    let xpTotal = 0;
    
    document.querySelectorAll('#modal-retos-temp input[type="checkbox"]').forEach(input => {
        const idx = parseInt(input.dataset.idx);
        const checked = input.checked;
        
        clienteEnEdicion.retos[idx] = checked;
        
        if (checked) {
            xpTotal += XP_RETOS[idx];
        }
    });

    document.getElementById('retos-xp').textContent = xpTotal;
    
    const r = RANKS.find(rk => xpTotal >= rk.min && xpTotal <= rk.max);
    document.getElementById('retos-rango').textContent = r.emoji + ' ' + r.name;
}

function guardarVistaRetos() {
    const idx = clientes.findIndex(c => c.id === clienteEnEdicion.id);
    
    let xpTotal = 0;
    clienteEnEdicion.retos.forEach((completado, i) => {
        if (completado) xpTotal += XP_RETOS[i];
    });
    
    clientes[idx] = {...clienteEnEdicion, xp: xpTotal};
    
    guardarDatos();
    mostrarAdmin();
    cerrarVistaRetos();
}

function cerrarVistaRetos() {
    const modal = document.getElementById('modal-retos-temp');
    if (modal) modal.remove();
    clienteEnEdicion = null;
}

function guardarCliente() {
    const nombre = document.getElementById('campo-nombre').value.trim();
    const id = document.getElementById('campo-id').value.trim().toUpperCase();
    const telefono = document.getElementById('campo-telefono').value.trim();
    const fecha = document.getElementById('campo-fecha').value;
    const xp = parseInt(document.getElementById('campo-xp').value) || 0;

    if (!nombre || !id) {
        alert('⚠️ Nombre e ID son requeridos');
        return;
    }

    if (!id.startsWith('FDT')) {
        alert('⚠️ El ID debe empezar con FDT (ej: FDT1014)');
        return;
    }

    if (clientes.find(c => c.id === id && (!clienteEnEdicion || c.id !== clienteEnEdicion.id))) {
        alert('⚠️ Ya existe un cliente con este ID');
        return;
    }

    if (clienteEnEdicion) {
        const idx = clientes.findIndex(c => c.id === clienteEnEdicion.id);
        clientes[idx] = {id, nombre, telefono, fecha, xp, retos: clienteEnEdicion.retos || Array(54).fill(false)};
    } else {
        clientes.push({id, nombre, telefono, fecha, xp, retos: Array(54).fill(false)});
    }

    guardarDatos();
    mostrarAdmin();
    cerrarModal();
}

function eliminarCliente(id) {
    if (confirm('¿Estás seguro?')) {
        clientes = clientes.filter(c => c.id !== id);
        guardarDatos();
        mostrarAdmin();
    }
}

function cerrarModal() {
    document.getElementById('modal-cliente').classList.remove('active');
}

function descargarJSON() {
    const blob = new Blob([JSON.stringify(clientes, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'clientes.json';
    a.click();
    URL.revokeObjectURL(url);
    alert('✅ Archivo descargado: clientes.json\n\n📤 Para sincronizar en otros dispositivos:\n1. Ve a github.com/daorcu/carnet-fdt\n2. Sube este archivo como clientes.json en el repo\n3. Listo, todos los dispositivos lo verán');
}

function cargarJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (evt) => {
        try {
            const datos = JSON.parse(evt.target.result);
            if (Array.isArray(datos)) {
                clientes = datos;
                guardarDatos();
                mostrarAdmin();
                alert('✅ Datos cargados');
            } else alert('❌ Formato inválido');
        } catch(err) {
            alert('❌ Error al cargar');
        }
    };
    reader.readAsText(file);
    e.target.value = '';
}

window.addEventListener('load', cargarDatos);
</script>
